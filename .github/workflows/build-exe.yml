name: Build exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Gozcu.exe derle
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Gozcu-exe
          path: |
            dist/Gozcu.exe
            dist/Gozcu.exe.sha256
      - name: Sürüme ekle (yalnızca etiket gönderiminde)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Gözcü $tag" --generate-notes --prerelease }
          gh release upload $tag dist/Gozcu.exe dist/Gozcu.exe.sha256 --clobber
